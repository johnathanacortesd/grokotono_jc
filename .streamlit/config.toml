[server]
maxUploadSize = 200
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#FF6A00"
font = "sans serif"
baseRadius = "large"
buttonRadius = "full"

[theme.light]
primaryColor = "#FF6A00"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F5"
textColor = "#0A0A0A"
linkColor = "#FF6A00"
borderColor = "#ECECE8"

[theme.dark]
primaryColor = "#FF6A00"
backgroundColor = "#000000"
secondaryBackgroundColor = "#121212"
textColor = "#EDEDED"
linkColor = "#FF8A33"
borderColor = "#2A2A2A"

[theme.light.sidebar]
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#ECECE8"
textColor = "#0A0A0A"
borderColor = "#ECECE8"

[theme.dark.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#121212"
textColor = "#EDEDED"
borderColor = "#2A2A2A"
